type: "complete_loss"

# Complete-loss jamming: once activation fires, no GPS_INPUT is delivered.
# Activation values carried over from the former jamming preset.

canberra:
  activation_alt: 30.0
  activation_alt_tolerance: 1.0
  activation_delay_seconds: 10

ornl:
  activation_alt: 25.0
  activation_alt_tolerance: 1.0
  activation_delay_seconds: 5
