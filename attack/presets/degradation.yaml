type: "degradation"

# Degradation jamming: keep authentic position/velocity, but ramp GPS quality
# from nominal toward `worst` over `ramp_seconds` (alpha = 0 -> 1). fix_type is
# held nominal during the ramp and downgraded to worst.fix_type at full severity.
#
# Primary behavioral fields (affect ArduPilot's EKF): horizontal_accuracy (m),
# vertical_accuracy (m), speed_accuracy (m/s), fix_type (3=3D -> 2=2D).
# Secondary consistency fields (coherent degraded state, not the in-flight
# driver): hdop, vdop, satellites_visible.

_worst_defaults: &worst
  horizontal_accuracy: 50.0
  vertical_accuracy: 100.0
  speed_accuracy: 10.0
  fix_type: 2
  hdop: 20.0
  vdop: 20.0
  satellites_visible: 5

canberra:
  activation_alt: 30.0
  activation_alt_tolerance: 1.0
  activation_delay_seconds: 10
  ramp_seconds: 30.0
  worst: *worst

ornl:
  activation_alt: 25.0
  activation_alt_tolerance: 1.0
  activation_delay_seconds: 5
  ramp_seconds: 30.0
  worst: *worst
